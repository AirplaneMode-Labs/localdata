[workspace]
resolver = "2"
members = ["crates/ldvec"]

# Release profile for the WASM builds (scripts/build-wasm.mjs). Debug info is off and symbols are
# stripped so no builder path survives; panic = "abort" keeps the module small and makes any bug a
# WebAssembly trap, which the TypeScript boundary turns into a StorageError.
[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
debug = false
strip = true

# The HNSW tests build graphs over 10,000 x 384 vectors and fuzz the validator 10,000 times: an
# unoptimised test build would take many minutes. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 3
