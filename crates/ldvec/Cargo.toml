[package]
name = "ldvec"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Flat vector index kernel for @airplanemode/localdata: CRC-32C, on-disk validation, norms and a bit-exact SIMD or scalar scan."
