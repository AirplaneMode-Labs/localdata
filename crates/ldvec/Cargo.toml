[package]
name = "ldvec"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Vector index kernel for @airplanemode/localdata: CRC-32C, on-disk validation, norms, a bit-exact SIMD or scalar flat scan, and an in-house HNSW graph (build, search, insert, serialise and validate), with no dependencies."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Zero dependencies on purpose (build-or-adopt rules TD-17 and TD-65): the flat scan, the on-disk
# validation and the in-house HNSW graph (about 1,300 lines in src/hnsw.rs; about 2,500 lines under src/ in
# all) are all a buyer has to audit, and no third-party crate enters the tree.
[dependencies]
